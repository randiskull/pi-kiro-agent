name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite finishes in well under a minute; anything past 15 is a hang, not
    # slowness. Without this a hung vitest burns the 6h job ceiling and the runner
    # discards the step's output when it kills it, so the log shows the command
    # starting and nothing else. Fail fast and keep the diagnosis.
    timeout-minutes: 15
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: test/spec-lint.test.ts resolves the commits the
          # spec-review calibration set cites, and a shallow clone has none of
          # them (spec-lint exits 2 there rather than passing).
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run check
      - run: npm test

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node scripts/secret-scan.mjs --all
