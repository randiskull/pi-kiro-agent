name: Kiro

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled, assigned]
  pull_request:
    types: [labeled, assigned]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  kiro:
    runs-on: ubuntu-latest
    # Only run if triggered by /kiro comment, kiro label, or kirocli assignment
    if: |
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/kiro')) ||
      (github.event_name == 'pull_request_review_comment' && startsWith(github.event.comment.body, '/kiro')) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'kiro') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'kiro') ||
      (github.event_name == 'issues' && github.event.action == 'assigned' && github.event.assignee.login == 'kirocli') ||
      (github.event_name == 'pull_request' && github.event.action == 'assigned' && github.event.assignee.login == 'kirocli')
    steps:
      # Gate on the triggering user's repo permission before spending the
      # KIRO_API_KEY or touching a write-capable agent. Without this, any user
      # who can comment `/kiro` (i.e. anyone, on a public repo) could drive an
      # agent that has contents/issues/pull-requests write. Require write+.
      - name: Check requester permission
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const username = context.actor;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username,
            });
            const allowed = new Set(["admin", "maintain", "write"]);
            if (!allowed.has(data.permission)) {
              core.setFailed(
                `@${username} cannot trigger Kiro: expected write, maintain, or admin; got ${data.permission}.`,
              );
            }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: kirodotdev-labs/kiro-action@v0
        with:
          kiro_api_key: ${{ secrets.KIRO_API_KEY }}
