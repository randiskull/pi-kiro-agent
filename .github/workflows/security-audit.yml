name: Security audit

# Deterministic security bar (no API keys required):
#   - npm dependency audit, threshold + blocking gated by repo variables
#   - full-tree secret scan
# Mirrors the posture of the upstream gsd security-audit workflow, sized to
# this single-package extension. AI-driven review runs separately as a Kiro
# Automation (see .kiro/automations/security-scan.md).

on:
  pull_request:
    paths:
      - "package-lock.json"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "package-lock.json"
      - "package.json"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  # Repository variables (Settings → Secrets and variables → Actions → Variables).
  # Both optional — defaults keep the audit non-blocking and advisory.
  SECURITY_AUDIT_BLOCKING: ${{ vars.SECURITY_AUDIT_BLOCKING || 'true' }} # blocking by default; set repo var to "false" for advisory-only
  NPM_AUDIT_SEVERITY: ${{ vars.NPM_AUDIT_SEVERITY }} # info|low|moderate|high|critical (default: high)

jobs:
  npm-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: npm audit
        run: |
          npm audit --json --omit=dev > dependency-audit.json || true

          node <<'NODE'
          const fs = require("fs");

          const severityOrder = ["info", "low", "moderate", "high", "critical"];
          const threshold = (process.env.NPM_AUDIT_SEVERITY || "high").toLowerCase();
          const thresholdIndex = severityOrder.includes(threshold)
            ? severityOrder.indexOf(threshold)
            : severityOrder.indexOf("high");
          const blocking = process.env.SECURITY_AUDIT_BLOCKING === "true";

          const audit = JSON.parse(fs.readFileSync("dependency-audit.json", "utf8") || "{}");
          const counts = { info: 0, low: 0, moderate: 0, high: 0, critical: 0 };

          // Allowlist: advisories accepted as unfixable-by-consumer (upstream
          // shrinkwrap-frozen — see .audit-allowlist.json). Allowlisted findings
          // are reported but never block; anything NEW blocks as configured.
          let allow = [];
          try { allow = JSON.parse(fs.readFileSync(".audit-allowlist.json", "utf8")).allow ?? []; } catch {}
          const allowed = new Set(allow);
          let allowlistedCount = 0;
          const ghsaOf = (via) => (Array.isArray(via) ? via : [via])
            .filter((v) => v && typeof v === "object")
            .map((v) => (v.url || "").split("/").pop())
            .filter(Boolean);

          if (audit.vulnerabilities) {
            for (const vulnerability of Object.values(audit.vulnerabilities)) {
              const severity = vulnerability?.severity;
              if (!(severity in counts)) continue;
              const ids = ghsaOf(vulnerability.via ?? []);
              const isAllowed = ids.length > 0 && ids.every((id) => allowed.has(id));
              if (isAllowed) { allowlistedCount += 1; continue; }
              counts[severity] += 1;
            }
          } else if (audit.metadata?.vulnerabilities) {
            for (const severity of severityOrder) {
              counts[severity] = Number(audit.metadata.vulnerabilities[severity] || 0);
            }
          }

          const findingsAtThreshold = severityOrder
            .slice(thresholdIndex)
            .reduce((total, severity) => total + counts[severity], 0);

          const summary = [
            "# dependency audit summary",
            "",
            `Blocking: ${blocking}`,
            `Threshold: ${severityOrder[thresholdIndex]}`,
            `Findings at or above threshold: ${findingsAtThreshold}`,
            `Allowlisted (upstream-frozen, non-blocking): ${allowlistedCount}`,
            "",
            "| Severity | Count |",
            "| --- | ---: |",
            ...severityOrder.map((severity) => `| ${severity} | ${counts[severity]} |`),
            "",
          ].join("\n");

          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          }

          if (blocking && findingsAtThreshold > 0) {
            console.error(`Blocking: ${findingsAtThreshold} finding(s) at or above ${severityOrder[thresholdIndex]}.`);
            process.exit(1);
          }
          NODE

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit
          path: dependency-audit.json

  secret-scan:
    name: full-tree secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Scan all tracked files for secrets
        run: node scripts/secret-scan.mjs --all
